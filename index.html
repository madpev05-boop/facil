<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fácil: planeador financiero</title>
<meta name="description" content="Planeador financiero simple y gratis para jóvenes en Colombia. Sin cuenta, sin anuncios.">
<meta name="theme-color" content="#12241F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" aria-live="off"></main>
<div class="tabs" id="tabs" hidden></div>
<div id="fab-slot"></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="sheet-in" id="sheet-in"></div></dialog>
<div id="toast-slot" aria-live="polite"></div>
<noscript><p style="padding:16px">Fácil necesita JavaScript activado.</p></noscript>
<script src="logic.js"></script>
<script src="app.js"></script>
<script>
  // Funciona sin internet una vez abierta: registra el service worker si el navegador lo permite.
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
</body>
</html>
